name: Bug report
description: Report a reproducible issue in the Godot puzzle
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "Level, gesture, device, expected and actual behavior"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / Godot version / Android device
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots and diagnostics
